[project]
name = "plynx"
version = "2.0.0"
description = "PLynx engine, CLI, and server."
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "fastapi>=0.110",
    "plynx-sdk",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "ruamel.yaml>=0.18",
    "uvicorn>=0.30",
]

[project.scripts]
plynx = "plynx.cli:main"

[tool.uv.sources]
plynx-sdk = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.0,<0.10"]
build-backend = "uv_build"
