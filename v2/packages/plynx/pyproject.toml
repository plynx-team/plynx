[project]
name = "plynx"
version = "2.0.0"
description = "PLynx engine, CLI, and server."
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "fastapi>=0.110",
    "plynx-sdk>=2.0.0,<3.0.0",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "ruamel.yaml>=0.18",
    "uvicorn>=0.30",
]

[project.scripts]
plynx = "plynx.cli:main"

[tool.uv.sources]
plynx-sdk = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "src/plynx/static/**",
    "src/plynx/builtin_packs/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/plynx/**",
    "hatch_build.py",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/plynx"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
