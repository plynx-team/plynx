[project]
name = "media-studio"
version = "2.0.0"
description = "PLynx built-in Node Pack: generative audio, image processing, and media studio ops."
requires-python = ">=3.11"
dependencies = ["plynx-sdk", "pillow>=10.0"]

[build-system]
requires = ["uv_build>=0.9.0,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "media_studio"
