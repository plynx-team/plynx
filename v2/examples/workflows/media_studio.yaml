version: 1
name: Generative Media Studio
description: "Generates multi-voice musical audio, colorful fractal artwork, and master studio cards with real-time audio playback and image previews."
concurrency: 4

stages:
  s1_generation:
    title: "1. Media Synthesis"
    require_approval: false
  s2_processing:
    title: "2. FX & Mastering"
    require_approval: false
  s3_publish:
    title: "3. Card & Inspection"
    require_approval: false

nodes:
  fractal_art:
    op: media_studio/image:MandelbrotFractal
    stage: s1_generation
    title: "Fractal Generator"
    inputs:
      palette: "neon_glow"
      width: 400
      height: 400
      max_iter: 90
      zoom: 1.2

  synth_chords:
    op: media_studio/audio:ChordProgression
    stage: s1_generation
    title: "Harmonic Chords"
    inputs:
      progression: "ambient_drone"
      tempo_bpm: 110
      duration_sec: 5.0
      volume: 0.6

  image_effects:
    op: media_studio/image:ImageFilterOp
    stage: s2_processing
    title: "Image Styling"
    inputs:
      image:
        from_node: fractal_art
        output: image
      filter_type: "edge_enhance"

  audio_echo:
    op: media_studio/audio:AudioEchoFilter
    stage: s2_processing
    title: "Echo & Space Reverb"
    inputs:
      audio:
        from_node: synth_chords
        output: audio
      delay_ms: 220
      decay: 0.45
      repeats: 3

  studio_card:
    op: media_studio/image:CardOrPoster
    stage: s3_publish
    title: "Studio Album Card"
    inputs:
      image:
        from_node: image_effects
        output: filtered_image
      title: "Neon Echoes"
      subtitle: "Generative Audio & Visual Art"
      badge: "MASTER"
      border_color: "#00d8ff"

  media_audit:
    op: media_studio/inspect:MediaMetadataInspector
    stage: s3_publish
    title: "Media Inspector"
    inputs:
      image:
        from_node: studio_card
        output: card
      audio:
        from_node: audio_echo
        output: filtered_audio
