version: 1
name: foo_or_woo
concurrency: 4
stages:
  ask:
    title: 1. Ask
  review:
    title: Review
    require_approval: true
  print: {}
nodes:
  pick:
    op: standard_io/demo:AskFooOrWoo
    title: Pick one
    stage: ask
    inputs:
      prompt: foo or woo?
  echo:
    op: standard_io/demo:Echo
    stage: print
    inputs:
      text: $concat.text
  concat:
    op: standard_io/demo:Concat
    title: Concat text
    stage: review
    inputs:
      b: $pick.choice
      a: 'Hello, '
