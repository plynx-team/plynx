version: 1
name: interactive_wizard_staged
description: "Interactive onboarding wizard demonstrating AskChoice, MultiStepQuestionnaire with idempotent checkpoints, stage approval gates, TemplateFormat, and MarkdownReport."
stages:
  input_stage:
    title: "1. User Survey & Questionnaire"
    require_approval: false
  review_gate:
    title: "2. Manager Approval Gate"
    require_approval: true
  report_stage:
    title: "3. Final Onboarding Report"
    require_approval: false
nodes:
  choice:
    op: standard_io/interactive:AskChoice
    title: "Project Category Selection"
    stage: input_stage
    inputs:
      question: "Select your project category:"
      options_csv: "Machine Learning, Web Automation, Audio Production, Data Analytics"
  survey:
    op: standard_io/interactive:MultiStepQuestionnaire
    title: "3-Step User Questionnaire"
    stage: input_stage
    inputs:
      intro_prompt: "Welcome to the interactive project onboarding wizard."
  format_summary:
    op: standard_io/data:TemplateFormat
    title: "Format Profile Summary"
    stage: review_gate
    inputs:
      template: "Project Category: {a}\nUser Role: {b}\nGoal: {c}"
      a: $choice.choice
      b: $survey.step1_answer
      c: $survey.step2_answer
  final_report:
    op: standard_io/files:MarkdownReport
    title: "Compile Onboarding Report"
    stage: report_stage
    inputs:
      title: "Project Onboarding Summary"
      body: $format_summary.text
      filename: "onboarding_report.md"
