[project]
name = "podcast-studio"
version = "2.0.0"
description = "PLynx built-in Node Pack: macOS native voice synthesis and podcast show notes publishing."
requires-python = ">=3.11"
dependencies = [
    "plynx-sdk",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "podcast_studio"
