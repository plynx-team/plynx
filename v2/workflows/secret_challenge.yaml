version: 1
name: secret_code_challenge
description: Interactive checkpoint challenge. Enter code 42 to proceed.
nodes:
  challenge:
    op: standard_io/demo:SecretCodeChallenge
    title: Secret Code Challenge
    inputs:
      prompt: "Clearance Verification: Choose the access code"
  echo:
    op: standard_io/demo:Echo
    title: Print Granted Message
    inputs:
      text: $challenge.message
