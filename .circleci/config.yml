version: 2.1

commands:
  checkout_code:
    description: "Checkout repository code via HTTPS"
    steps:
      - run:
          name: Checkout code
          command: |
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            git init
            git remote add origin https://github.com/plynx-team/plynx.git || git remote set-url origin https://github.com/plynx-team/plynx.git
            git fetch --depth=50 origin "$CIRCLE_SHA1" 2>/dev/null || git fetch --depth=50 origin "$CIRCLE_BRANCH"
            git checkout -qf "$CIRCLE_SHA1"
            git submodule update --init --recursive || true

jobs:
  build_package:
    working_directory: ~/plynx
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout_code
      - run:
          name: install requirements
          command: |
            set -x
            pip install uv
            uv pip install --system -e ".[all]"

      # Run linters and unit tests
      - run:
          name: flake8
          command: flake8 plynx tests
      - run:
          name: isort
          command: isort --check-only plynx tests
      - run:
          name: mypy
          command: mypy plynx --ignore-missing-imports
      - run:
          name: pylint
          command: pylint --disable=F0401 plynx
      - run:
          name: pytest
          command: uv run pytest

      - run:
          name: python package build and installation
          command: |
            uv build
            uv pip install --system dist/*.whl

  build_docker:
    machine: true
    steps:
      - checkout_code
      - run:
          name: copy config file
          command: cp template_config.yaml config.yaml
      - run:
          name: build docker images
          command: make build
      - run:
          name: Run tests
          command: make run_tests

workflows:
  version: 2
  build_and_test:
    jobs:
      - build_package
      - build_docker
