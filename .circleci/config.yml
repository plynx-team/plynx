version: 2.1
jobs:
  build_package:
    working_directory: ~/plynx
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: install requirements
          command: |
            set -x
            pip install --upgrade pip
            pip install -e ".[all]"

      # Run linters and unit tests
      - run:
          name: flake8
          command: flake8 plynx tests
      - run:
          name: isort
          command: isort --check-only plynx tests
      - run:
          name: mypy
          command: mypy plynx --ignore-missing-imports
      - run:
          name: pylint
          command: pylint --disable=F0401 plynx
      - run:
          name: pytest
          command: python -m pytest

      - run:
          name: python package build and installation
          command: |
            python -m build
            pip install dist/*.whl

  build_docker:
    machine: true
    steps:
      - checkout
      - run:
          name: copy config file
          command: cp template_config.yaml config.yaml
      - run:
          name: build docker images
          command: make build
      - run:
          name: Run tests
          command: make run_tests

workflows:
  version: 2
  build_and_test:
    jobs:
      - build_package
      - build_docker
