[project]
name = "doc-review"
version = "2.0.0"
description = "PLynx example Node Pack: document inspection, translation adapter, and batch-checkpoint review brief."
requires-python = ">=3.11"
dependencies = [
    "plynx-sdk",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "doc_review"
