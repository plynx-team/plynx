version: 1
name: adaptive_doc_review
description: "Showcase workflow composing statistical language detection (self.warn), StageSupervisor dynamic translation splicing, standard_io AskQuestions batch checkpoints, and MarkdownReport."
stages:
  ingest:
    title: "1. Ingest & Language Check"
    require_approval: false
    validator:
      op: standard_io/agent:StageSupervisor
      mode: on_anomaly
      allow_graph_edits: confirm
      inputs:
        prompt: >-
          If detect_lang emits a warning that the detected language differs from 'en',
          propose a graph_patch that adds node translate_doc (op: language_tools/ops:TranslateText,
          stage: ingest, inputs: {text: $detect_lang.text, target_language: English}) and
          rewires format_body.document to $translate_doc.text.
  review:
    title: "2. Preferences & Report"
    require_approval: false
nodes:
  detect_lang:
    op: language_tools/ops:DetectLanguage
    title: "Detect Document Language"
    stage: ingest
    inputs:
      text: "Bonjour l'équipe. Le rapport trimestriel montre que les revenus ont augmenté de 14 % grâce aux renouvellements entreprises. Merci pour votre collaboration."
      expected_language: "en"
  ask_preferences:
    op: standard_io/interactive:AskQuestions
    title: "Collect Review Preferences"
    stage: review
    inputs:
      questions:
        - id: audience
          header: "Target Audience"
          question: "Who is the primary audience for this review?"
          options: ["Executive", "Engineering", "Legal"]
          multi_select: false
          allow_freeform: true
        - id: focus
          header: "Focus Areas"
          question: "Which focus areas should be highlighted?"
          options: ["Metrics", "Risks", "Action Items"]
          multi_select: true
          allow_freeform: false
  format_body:
    op: standard_io/data:TemplateFormat
    title: "Format Review Body"
    stage: review
    inputs:
      template: "{preferences}\n\n## Document Content\n\n{document}"
      preferences: $ask_preferences.summary_markdown
      document: $detect_lang.text
  final_report:
    op: standard_io/files:MarkdownReport
    title: "Generate Markdown Report"
    stage: review
    inputs:
      title: "Quarterly Document Review"
      body: $format_body.text
      filename: "review_brief.md"
