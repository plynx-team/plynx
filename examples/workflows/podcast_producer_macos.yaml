version: 1
name: podcast_producer_macos
description: "Automated podcast producer composing macOS native voiceover (say), MIDI chord progression + Rhodes PolySynth BGM, automatic audio ducking mixer, waveform visualizer, and Markdown show notes. (macOS only: requires native 'say' command)"
stages:
  voiceover_bgm:
    title: "1. Voiceover & BGM (macOS only)"
  mixing:
    title: "2. Studio Audio Ducking & Mixing"
  publishing:
    title: "3. Visuals & Publishing"
nodes:
  voiceover:
    op: podcast_studio/voice:TextToSpeech
    title: "macOS Native Voiceover (macOS only)"
    stage: voiceover_bgm
    inputs:
      text: "Welcome to Plynx Studio! In today's episode, we explore reproducible graph automation, macOS native voice synthesis, and dynamic audio ducking with zero cloud API keys. Pure local magic."
      voice: "Samantha"
      rate: 175
  bgm_score:
    op: pedalboard_studio/score:ChordProgressionScore
    title: "Lo-Fi Chord Progression (MIDI)"
    stage: voiceover_bgm
    inputs:
      progression: "ii7 - V7 - Imaj7 - vi7"
      key: "C"
      bpm: 84
      bars: 8
      voicing_style: "arpeggio"
  bgm_synth:
    op: pedalboard_studio/synth:PolySynth
    title: "Warm Rhodes BGM Synth"
    stage: voiceover_bgm
    inputs:
      midi: $bgm_score.midi
      waveform: "rhodes"
      cutoff_hz: 2400.0
      stereo_width: 0.65
  mixer:
    op: pedalboard_studio/effects:AudioMixer
    title: "Audio Mixer & Ducker"
    stage: mixing
    inputs:
      track_1: $voiceover.voiceover
      track_2: $bgm_synth.audio
      track_1_gain: 1.0
      track_2_gain: 0.35
      ducking_enabled: true
      ducking_amount_db: 14.0
      lead_in_sec: 1.0
      tail_sec: 2.0
      loop_background: true
  waveform_visualizer:
    op: media_studio/inspect:AudioWaveformVisualizer
    title: "Podcast Waveform Visualizer"
    stage: publishing
    inputs:
      audio: $mixer.mixed_audio
      width: 800
      height: 240
      theme: "emerald"
  show_notes:
    op: podcast_studio/notes:ShowNotesGenerator
    title: "Show Notes & Transcript"
    stage: publishing
    inputs:
      title: "Episode 1: Pure Local Magic with macOS Voice"
      podcast_name: "Plynx Audio Labs"
      host: "Plynx Studio"
      summary: "In this episode, we demonstrate how macOS native voice synthesis pairs with procedural lo-fi background music, automatic audio ducking, and atomic reproducibility. Zero API keys, pure local magic."
      chapters: |-
        00:00 - Introduction & Welcome
        00:01 - macOS Native Speech & Zero API Keys
        00:06 - Dynamic Audio Ducking & Mixing
        00:11 - Atomic Reproducibility & Outro
      transcript: "Welcome to Plynx Studio! In today's episode, we demonstrate how macOS native voice synthesis pairs with procedural lo-fi background music, automatic audio ducking, and atomic reproducibility. Zero API keys, pure local magic."
      production_notes: |-
        - **Speech Engine:** macOS Native TTS (`say` with PCM 16-bit 44.1 kHz LEI16).
        - **BGM:** Procedural lo-fi chord synthesis with Rhodes electric piano harmonics.
        - **Mixing:** Automatic RMS ducking (-14 dB attenuation during voice).
