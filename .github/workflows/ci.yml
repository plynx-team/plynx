name: CI

on:
  push:
    branches: ["main", "v2"]
  pull_request:
    branches: ["main", "v2"]

jobs:
  test:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Sync workspace dependencies
        run: uv sync

      - name: Check generated TypeScript types
        run: uv run python scripts/gen_ts_types.py --check

      - name: Ruff lint and format check
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Mypy static typecheck
        run: uv run mypy

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: UI lint and typecheck
        working-directory: ui
        run: |
          npm run lint
          npm run typecheck

      - name: UI vitest suite
        working-directory: ui
        run: npm test

      - name: Build UI static assets
        working-directory: ui
        run: npm run build

      - name: Pytest backend test suite
        run: uv run pytest

      - name: Build wheels with static UI and builtin packs
        run: uv run python scripts/build.py

      - name: Wheel smoke test
        run: uv run pytest tests/test_wheel.py

  e2e:
    name: Playwright E2E Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Sync workspace dependencies
        run: uv sync

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Build UI static assets
        working-directory: ui
        run: npm run build

      - name: Run Playwright E2E smoke tests
        working-directory: ui
        run: npm run test:e2e
